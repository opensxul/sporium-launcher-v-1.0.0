[package]
name = "sporium"
version = "1.0.1"
description = "Sporium Minecraft launcher and instance library"
edition = "2024"
rust-version = "1.98"
default-run = "sporium"

[lib]
name = "sporium_lib"
crate-type = ["rlib"]

[features]
dev-tools = []

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["dev-tools"]

[[bin]]
name = "game-probe"
path = "src/bin/game-probe.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
tracing-appender = "=0.2.5"
ts-rs = "=12.0.1"
uuid = { version = "=1.26.1", features = ["v4"] }
fs2 = "=0.4.3"
opener = "=0.8.5"
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "=1.13.1"
toml = "=1.1.6"
rfd = "=0.17.2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
minisign-verify = "=0.2.5"
