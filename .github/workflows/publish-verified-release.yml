name: Publish verified Sporium 1.0.1 installer

on:
  push:
    branches: [codex/publish-v1.0.1]

permissions:
  contents: write

concurrency:
  group: sporium-release-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'opensxul/sporium-launcher-v-1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the locally verified release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          cd artifacts
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          for file in SporiumLauncher.exe SporiumLauncher.exe.sig SHA256SUMS.txt latest.json; do
            curl --fail --location --retry 3 "$base/.release/$file" --output "$file"
          done
          curl --fail --location --retry 3 "$base/docs/releases/1.0.1.md" --output notes.md
          echo 'dd96916a4766b0d1add457dab605ba3eae0676e20d313ffeea9265d7351fe7c1  SporiumLauncher.exe' | sha256sum --check -
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('latest.json').read_text())
          assert data['version'] == '1.0.1'
          assert data['size'] == Path('SporiumLauncher.exe').stat().st_size
          platform = data['platforms']['windows-x86_64']
          assert platform['signature'] == Path('SporiumLauncher.exe.sig').read_text().strip()
          assert platform['url'] == 'https://github.com/opensxul/sporium-launcher-v-1.0.0/releases/download/v1.0.1/SporiumLauncher.exe'
          PY
      - name: Publish all assets together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v1.0.1 --draft --target 14433b5666a5a6eed8117f99aa07a0410f63801f --title 'Sporium 1.0.1' --notes-file artifacts/notes.md
          gh release upload v1.0.1 artifacts/SporiumLauncher.exe artifacts/SporiumLauncher.exe.sig artifacts/SHA256SUMS.txt artifacts/latest.json
          gh release edit v1.0.1 --draft=false --latest
